<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CLARA</title>
<style>
:root{--bg:#fff;--fg:#000;--muted:#6b6b6b;--hair:#e4e4e4;--field:#f4f4f4;--btn:#000;--btn-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--muted:#9a9a9a;--hair:#262626;--field:#141414;--btn:#fff;--btn-ink:#000;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-left,0px))}
header{border-bottom:1px solid var(--hair)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.mark{font-weight:700;font-size:22px;letter-spacing:-.03em}
.nav{font-size:15px;color:var(--muted)}
main{flex:1;display:flex;align-items:center}
main .wrap{padding-top:72px;padding-bottom:96px}
.eyebrow{font-size:15px;color:var(--muted);margin:0 0 20px}
h1{font-size:clamp(44px,8vw,112px);font-weight:500;letter-spacing:-.045em;line-height:.95;margin:0 0 56px;max-width:11ch}
form{display:grid;gap:14px;max-width:440px}
label{font-size:15px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:17px "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--fg);background:var(--field);border:1px solid transparent;border-radius:999px;padding:14px 22px}
input:focus{outline:none;border-color:var(--fg)}
button{font:500 16px "Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:14px 26px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;transition:opacity .15s}
button:hover{opacity:.82}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
button:disabled{opacity:.5;cursor:default}
.arrow{transition:transform .2s}
button:hover .arrow{transform:translateX(3px)}
.err{font-size:14px;min-height:1.3em;margin:4px 0 0;color:var(--fg)}
footer{border-top:1px solid var(--hair)}
footer .wrap{display:flex;justify-content:space-between;height:64px;align-items:center;font-size:13px;color:var(--muted)}
@media (max-width:480px){.row{flex-direction:column}button{justify-content:center}}
</style>
</head>
<body>
<header><div class="wrap"><span class="mark">CLARA</span><span class="nav">Personas</span></div></header>
<main><div class="wrap">
  <p class="eyebrow">Private workspace</p>
  <h1>Designing for how people really think.</h1>
  <form id="gate">
    <label for="pw">Enter the password to continue</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
      <button id="go" type="submit">Open <span class="arrow" aria-hidden="true">→</span></button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </form>
</div></main>
<footer><div class="wrap"><span>CLARA / Personas</span><span>Restricted</span></div></footer>

<script>
(()=>{
const P=JSON.parse(document.getElementById("payload").textContent);
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(P.iv)},key,unb64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close();}
document.getElementById("gate").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value,btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;err.textContent="";
  try{const html=await unlock(pw);try{sessionStorage.setItem("clara-pw",pw)}catch(_){}show(html)}
  catch(_){err.textContent="That password didn't work. Try again.";btn.disabled=false;document.getElementById("pw").select()}
});
(async()=>{let pw=null;try{pw=sessionStorage.getItem("clara-pw")}catch(_){}
  if(pw){try{show(await unlock(pw))}catch(_){try{sessionStorage.removeItem("clara-pw")}catch(__){}}}})();
})();
</script>
