[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clara"
version = "0.1.0"
description = "Clara: simulated older-adult personas for cognitive accessibility testing of assistants"
requires-python = ">=3.10"
dependencies = [
    "smolagents[litellm]==1.26.0",
    "pandas",
]

[project.optional-dependencies]
studio = ["gradio==6.30.0"]

[tool.setuptools]
packages = ["clara"]

[tool.setuptools.package-data]
clara = ["skills/*/SKILL.md"]
